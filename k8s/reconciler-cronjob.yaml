# Runs the reconciler on a schedule. A CronJob rather than a long-running
# Deployment: the work is periodic and idempotent, so there's nothing to keep
# alive between runs, and Kubernetes guarantees one Pod per tick - no leader
# election needed to stop replicas racing each other.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconciler
spec:
  schedule: "*/1 * * * *"        # every minute; the finest cron granularity
  concurrencyPolicy: Forbid      # skip a tick rather than overlap a slow run
  successfulJobsHistoryLimit: 3  # keep a few finished Pods around for kubectl logs
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 60    # if we miss a tick by more than this, skip it
  jobTemplate:
    spec:
      backoffLimit: 2            # retry a failed run twice, then give up until next tick
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: reconciler
            image: distributedjobqueue-reconciler
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                memory: "32Mi"
                cpu: "50m"
              limits:
                memory: "64Mi"
                cpu: "200m"
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jobqueue-credentials
                  key: DATABASE_URL
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: jobqueue-credentials
                  key: AMQP_URL
            # Long enough that a job whose message is merely in flight isn't
            # republished, short enough that a genuine orphan is caught quickly.
            - name: STALE_QUEUED_SECONDS
              value: "120"
