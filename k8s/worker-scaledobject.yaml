apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-auth
spec:
  secretTargetRef:
  - parameter: host
    name: jobqueue-credentials
    key: RABBITMQ_MANAGEMENT_URL
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-scaler
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 5
  cooldownPeriod: 30
  triggers:
  - type: rabbitmq
    metadata:
      protocol: http
      vhostName: "/"      # default vhost; explicit so it isn't parsed from the URL path
      queueName: jobs
      mode: QueueLength
      value: "5"
    authenticationRef:
      name: rabbitmq-auth